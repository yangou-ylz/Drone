source [find interface/stlink-hla.cfg]
transport select hla_swd
adapter speed 1000

set CHIPNAME stm32f407

source [find target/stm32f4x.cfg]

reset_config none

# HLA is deprecated but useful for very old ST-Link/V2 firmware.
adapter speed 1000
stm32f407.cpu configure -event reset-start { adapter speed 1000 }
stm32f407.cpu configure -event reset-init { adapter speed 1000 }
