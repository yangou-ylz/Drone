adapter driver jlink
transport select swd
adapter speed 100

source [find target/stm32f4x.cfg]

reset_config none
cortex_m reset_config sysresetreq

# target/stm32f4x.cfg changes the adapter speed to 2000 kHz after sourcing,
# and raises it to 8000 kHz during reset-init. This J-Link/target setup is not
# stable there, so keep SWD at 100 kHz through reset and flash programming.
adapter speed 100
stm32f4x.cpu configure -event reset-start { adapter speed 100 }
stm32f4x.cpu configure -event reset-init { adapter speed 100 }
