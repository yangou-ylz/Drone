source [find interface/stlink.cfg]
transport select swd
adapter speed 1000

set CHIPNAME stm32f407

source [find target/stm32f4x.cfg]

reset_config none
cortex_m reset_config sysresetreq

# target/stm32f4x.cfg raises SWD speed during reset events; keep ST-Link slow
# until the exact probe and target board are known to be stable.
adapter speed 1000
stm32f407.cpu configure -event reset-start { adapter speed 1000 }
stm32f407.cpu configure -event reset-init { adapter speed 1000 }
