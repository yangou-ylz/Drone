adapter driver cmsis-dap
transport select swd
adapter speed 1000

set CHIPNAME stm32f103c8t6
set FLASH_SIZE 0x10000

source [find target/stm32f1x.cfg]

reset_config none
cortex_m reset_config sysresetreq

# Keep the link conservative for generic CMSIS-DAP probes and Blue Pill boards.
adapter speed 1000
stm32f103c8t6.cpu configure -event reset-start { adapter speed 1000 }
stm32f103c8t6.cpu configure -event reset-init { adapter speed 1000 }
