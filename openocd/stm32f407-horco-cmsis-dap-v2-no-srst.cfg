adapter driver cmsis-dap

# Horco CMSIS-DAP enumerates as a composite USB device:
#   if0/if1 = CDC ACM serial, if2 = CMSIS-DAPv2 vendor bulk endpoint.
# Lock OpenOCD to the bulk backend and interface 2 so it does not try the
# CDC serial interface or unrelated HID devices.
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0xfaed 0x4873
cmsis-dap usb interface 2
cmsis-dap quirk enable

transport select swd
adapter speed 1000

source [find target/stm32f4x.cfg]

reset_config none

# target/stm32f4x.cfg raises adapter speed in reset events. Keep this DAP at
# conservative speed until the link proves stable on this specific airframe.
adapter speed 1000
stm32f4x.cpu configure -event reset-start { adapter speed 1000 }
stm32f4x.cpu configure -event reset-init { adapter speed 1000 }
